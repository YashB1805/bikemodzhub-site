function shippingZone(customerState, customerCity) {
  if (customerCity && customerCity.trim().toLowerCase() === SHOP_CITY.toLowerCase()) return "local";
  if (customerState === SHOP_STATE) return "sameState";
  if (REGIONAL_STATES.includes(customerState)) return "regional";
  if (REMOTE_STATES.includes(customerState)) return "remote";
  return "national";
}
function parseDaysRange(text) {
  if (!text) return { min: 2, max: 4 };
  if (/next day/i.test(text)) return { min: 1, max: 1 };
  if (/same day/i.test(text)) return { min: 0, max: 0 };
  const nums = (text.match(/\d+/g) || []).map(Number);
  if (nums.length === 0) return { min: 2, max: 4 };
  if (nums.length === 1) return { min: nums[0], max: nums[0] };
  return { min: nums[0], max: nums[1] };
}
function fasterEta(text) {
  if (/same day/i.test(text)) return "Same day";
  const r = parseDaysRange(text);
  const min = Math.max(1, r.min - 1), max = Math.max(min, r.max - 1);
  return min === max ? `${min} day${min > 1 ? "s" : ""}` : `${min}-${max} days`;
}
// Returns the courier options with OUR OWN estimated price + ETA for the customer's
// typed city/pincode/state — this is intentionally NOT the live courier API price,
// so your shown price stays predictable and under your control (no surprise loss if
// the real courier ends up charging more). The backend is still used separately to
// actually book the real shipment once an order is placed.
function getShippingOptions(city, state, pincode) {
  const cityKey = (city || "").trim().toLowerCase();
  let cityInfo = CITY_SHIPPING[cityKey];
  if (!cityInfo && pincode && pincode.trim().length >= 3) {
    const prefix = pincode.trim().slice(0, 3);
    const mappedCity = PINCODE_PREFIX_CITY[prefix];
    if (mappedCity) cityInfo = CITY_SHIPPING[mappedCity];
  }
  if (cityInfo) {
    return COURIERS.map((c) => ({
      id: c.id, name: c.name,
      price: Math.round(cityInfo.rate * c.priceMultiplier),
      eta: c.express ? fasterEta(cityInfo.eta) : cityInfo.eta,
    }));
  }
  const zone = shippingZone(state, city);
  return COURIERS.map((c) => ({ id: c.id, name: c.name, price: c.rates[zone], eta: c.eta[zone] }));
}
// Tries the real backend (Delhivery + Shiprocket live rates) first. If the backend
// isn't running or reachable, returns null so the caller can fall back to the
// estimated CITY_SHIPPING/zone pricing — the site never breaks either way.
function addDays(dateInput, days) { const d = new Date(dateInput); d.setDate(d.getDate() + days); return d; }
function estimateDeliveryWindow(order) {
  const prepDays = (order.items || []).reduce((max, i) => Math.max(max, parseDaysRange(i.deliveryTime).max), 1);
  const transit = parseDaysRange(order.courierEta);
  const start = addDays(order.createdAt, prepDays + transit.min);
  const end = addDays(order.createdAt, prepDays + transit.max);
  const fmt = (d) => d.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" });
  return start.toDateString() === end.toDateString() ? fmt(start) : `${fmt(start)} – ${fmt(end)}`;
}
// Builds a link to the courier's own tracking page, where the customer sees the
// real live location/status once we've handed the package over (AWB entered by admin).
function courierTrackingUrl(courierPartner, trackingNumber) {
  if (!trackingNumber) return null;
  const n = (courierPartner || "").toLowerCase();
  if (n.includes("delhivery")) return `https://www.delhivery.com/track-v2/package/${encodeURIComponent(trackingNumber)}`;
  if (n.includes("shiprocket")) return `https://shiprocket.co/tracking/${encodeURIComponent(trackingNumber)}`;
  return null;
}

function TiltCard({ children, className = "" }) {
  const [style, setStyle] = useState({});
  function onMove(e) {
    const r = e.currentTarget.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    setStyle({ transform: `perspective(700px) rotateX(${(0.5 - py) * 14}deg) rotateY(${(px - 0.5) * 14}deg) translateZ(4px)`, boxShadow: "0 18px 30px -12px rgba(0,0,0,0.55)" });
  }
  function onLeave() { setStyle({ transform: "perspective(700px) rotateX(0deg) rotateY(0deg) translateZ(0px)", boxShadow: "none" }); }
  return <div className={`tilt-card ${className}`} style={style} onMouseMove={onMove} onMouseLeave={onLeave}>{children}</div>;
}

// ============================================================
function App() {
  const [view, setView] = useState("shop");
  const [products, setProducts] = useState(null);
  const [orders, setOrders] = useState([]);
  const [cart, setCart] = useState({});
  const [loading, setLoading] = useState(true);
  const [lastOrderId, setLastOrderId] = useState(null);
  const [toast, setToast] = useState(null);
  const [bump, setBump] = useState(false);

  const showToast = useCallback((msg) => { setToast(msg); setTimeout(() => setToast(null), 2500); }, []);

  useEffect(() => {
    let p = loadProducts();
    if (!p) { p = SEED_PRODUCTS; saveProducts(p); }
    const o = loadOrders();
    setProducts(p); setOrders(o); setLoading(false);
  }, []);

  const addToCart = (id) => { setCart((c) => ({ ...c, [id]: (c[id] || 0) + 1 })); setBump(true); setTimeout(() => setBump(false), 350); };
  const decFromCart = (id) => setCart((c) => { const n = { ...c }; if (n[id] <= 1) delete n[id]; else n[id] -= 1; return n; });
  const removeFromCart = (id) => setCart((c) => { const n = { ...c }; delete n[id]; return n; });

  const cartItems = products ? Object.entries(cart).map(([id, qty]) => { const prod = products.find((p) => p.id === id); return prod ? { ...prod, qty } : null; }).filter(Boolean) : [];
  const cartTotal = cartItems.reduce((sum, i) => sum + i.price * i.qty, 0);
  const cartCount = cartItems.reduce((sum, i) => sum + i.qty, 0);

  // Step 1: customer has filled the checkout form and needs to pay. We create the
  // order right away with paymentStatus "Pending" so that if they abandon the QR
  // screen without paying, Track Order still finds the order and shows it as Pending —
  // it only flips to Paid once they confirm on the scanner screen.
  function createPendingOrder({ name, phone, altPhone, houseNo, street, landmark, pincode, address, city, state, courier, courierEta, shippingCharge }) {
    const order = {
      id: "ORD" + uid("").replace(/[^0-9]/g, "").slice(-8),
      items: cartItems.map(({ id, name, price, qty, sku, deliveryTime }) => ({ id, name, price, qty, sku, deliveryTime })),
      subtotal: cartTotal, shippingCharge, total: cartTotal + shippingCharge,
      courierPartner: courier, courierEta,
      customerName: name, phone, altPhone, houseNo, street, landmark, pincode, address, city, state,
      pickupAddress: SHOP_ADDRESS, paymentMethod: "UPI",
      paymentStatus: "Pending", trackingNumber: "",
      orderStatus: "Placed", createdAt: new Date().toISOString(),
    };
    const nextOrders = [order, ...orders];
    setOrders(nextOrders); saveOrders(nextOrders);
    setLastOrderId(order.id); setView("payment");
    return order;
  }

  // Step 2: Razorpay's handler fires this after a successful payment in the popup.
  // Stock is deducted only now, once the order is actually confirmed as paid.
  function confirmPayment(orderId, razorpayPaymentId) {
    const nextOrders = orders.map((o) => o.id === orderId ? { ...o, paymentStatus: "Paid", razorpayPaymentId: razorpayPaymentId || "" } : o);
    setOrders(nextOrders); saveOrders(nextOrders);
    const paidOrder = nextOrders.find((o) => o.id === orderId);
    if (paidOrder) {
      const nextProducts = products.map((p) => { const item = paidOrder.items.find((i) => i.id === p.id); return item ? { ...p, stock: Math.max(0, p.stock - item.qty) } : p; });
      setProducts(nextProducts); saveProducts(nextProducts);
    }
    setCart({}); setView("track"); showToast("Payment received — order placed!");
  }

  // If the customer backs out of the QR screen without paying, drop the unpaid
  // order so it doesn't sit around forever, and return them to their cart.
  function cancelPendingOrder(orderId) {
    const nextOrders = orders.filter((o) => o.id !== orderId);
    setOrders(nextOrders); saveOrders(nextOrders);
    setView("cart");
  }

  if (loading) return <div className="min-h-screen bg-[#141416] flex items-center justify-center"><Icon name="loader" size={32} className="text-[#E8571F]" /></div>;

  return (
    <div className="min-h-screen bg-[#141416] text-[#F2F0EB] font-body">
      <TopBar view={view} setView={setView} cartCount={cartCount} cartTotal={cartTotal} bump={bump} />

      {cartCount > 0 && view !== "cart" && view !== "payment" && (
        <button onClick={() => setView("cart")} className="sticky top-[57px] z-30 w-full bg-[#E8571F] text-[#141416] text-sm font-medium py-2.5 px-4 flex items-center justify-center gap-2 hover:bg-[#D14A15] transition-colors">
          <Icon name="cart" size={15} />
          <span className="bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold">{cartCount}</span>
          item{cartCount > 1 ? "s" : ""} added · {inr(cartTotal)} · View Cart
          <Icon name="chevron-right" size={15} />
        </button>
      )}

      {toast && (
        <div className="fixed top-4 right-4 z-50 bg-[#1C1C1E] border border-[#E8571F]/40 text-[#F2F0EB] px-4 py-2.5 rounded-lg shadow-lg flex items-center gap-2 text-sm">
          <Icon name="check-circle" size={16} className="text-[#E8571F]" /> {toast}
        </div>
      )}

      {view === "shop" && <ShopView products={products} onAdd={addToCart} />}
      {view === "cart" && <CartPage items={cartItems} subtotal={cartTotal} onInc={addToCart} onDec={decFromCart} onRemove={removeFromCart} onBackToShop={() => setView("shop")} onCreatePendingOrder={createPendingOrder} />}
      {view === "payment" && <PaymentScannerView order={orders.find((o) => o.id === lastOrderId)} onConfirm={confirmPayment} onCancel={cancelPendingOrder} />}
      {view === "track" && <TrackView orders={orders} highlightId={lastOrderId} />}
      {view === "admin" && <AdminView products={products} setProducts={(p) => { setProducts(p); saveProducts(p); }} orders={orders} setOrders={(o) => { setOrders(o); saveOrders(o); }} showToast={showToast} />}

      <WhatsAppButton />

      <footer className="border-t border-[#2A2A2E] mt-16 py-8 px-4">
        <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-sm text-[#8B8D92]">
          <div className="flex items-center gap-2">
            <BikeLogoMark size={28} />
            <span className="font-display font-bold text-[#F2F0EB]">BIKEMODZ<span className="text-[#E8571F]">HUB</span></span>
          </div>
          <p className="text-xs">Genuine spare parts · {SHOP_CITY}, {SHOP_STATE} · Shipped across India</p>
          <p className="text-xs">© {new Date().getFullYear()} BikeModzHub. All rights reserved.</p>
        </div>
      </footer>
    </div>
  );
}

function TopBar({ view, setView, cartCount, cartTotal, bump }) {
  const NavBtn = ({ id, label, icon }) => (
    <button onClick={() => setView(id)} title={label} className={`flex items-center gap-1.5 px-2 sm:px-3 py-1.5 rounded-md text-sm font-medium transition-colors ${view === id ? "bg-[#E8571F] text-[#141416]" : "text-[#B8B9BD] hover:text-[#F2F0EB] hover:bg-[#2A2A2E]"}`}>
      <Icon name={icon} size={15} /> <span className="hidden sm:inline">{label}</span>
    </button>
  );
  return (
    <header className="sticky top-0 z-40 bg-[#141416]/95 backdrop-blur border-b border-[#2A2A2E]">
      <div className="max-w-6xl mx-auto px-3 sm:px-4 py-2.5 sm:py-3 flex items-center justify-between gap-2 sm:gap-3">
        <div className="flex items-center gap-1.5 sm:gap-2 min-w-0">
          <BikeLogoMark size={30} />
          <span className="font-display font-bold text-base sm:text-xl tracking-wide truncate">BIKEMODZ<span className="text-[#E8571F]">HUB</span></span>
        </div>
        <nav className="flex items-center gap-1 sm:gap-1.5 shrink-0">
          <NavBtn id="shop" label="Shop" icon="package" />
          <NavBtn id="track" label="Track Order" icon="search" />
          <NavBtn id="admin" label="Admin" icon="login" />
          <button onClick={() => setView("cart")} className="relative ml-1 flex items-center gap-1.5 sm:gap-2 pl-1.5 sm:pl-2 pr-2 sm:pr-3 py-2 rounded-md text-[#B8B9BD] hover:text-[#F2F0EB] hover:bg-[#2A2A2E]">
            <span className="relative">
              <Icon name="cart" size={18} />
              {cartCount > 0 && <span className={`absolute -top-2 -right-2 bg-red-600 text-white text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center ${bump ? "cart-bump" : ""}`}>{cartCount}</span>}
            </span>
            {cartCount > 0 && <span className="hidden sm:inline text-sm font-medium text-[#F2F0EB]">{inr(cartTotal)}</span>}
          </button>
        </nav>
      </div>
    </header>
  );
}

function ShopView({ products, onAdd }) {
  const [query, setQuery] = useState("");
  const filtered = products.filter((p) => p.name.toLowerCase().includes(query.toLowerCase()) || p.sku.toLowerCase().includes(query.toLowerCase()));
  return (
    <div className="max-w-6xl mx-auto px-4 py-8">
      <div className="flex flex-col sm:flex-row items-center gap-6 mb-10 bg-[#1C1C1E] border border-[#2A2A2E] rounded-2xl p-6 sm:p-8 overflow-hidden">
        <BikeLogoMark size={150} animated />
        <div className="text-center sm:text-left">
          <p className="font-mono text-xs text-[#E8571F] tracking-widest mb-2">GENUINE · FAST DISPATCH · PAN INDIA</p>
          <h1 className="font-display text-4xl sm:text-5xl font-bold leading-none mb-2">Spare Parts, <span className="text-[#E8571F]">Built To Last</span></h1>
          <p className="text-[#8B8D92] text-sm max-w-md">Har part ka SKU, stock, price aur delivery time ek jagah. Order karo, track karo, delivery tak.</p>
        </div>
      </div>
      <div className="mb-6"><h2 className="font-display text-2xl font-bold">Catalog</h2><p className="text-[#8B8D92] text-sm mt-1">Browse by name or SKU.</p></div>
      <div className="relative mb-6 max-w-sm">
        <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-[#5A5A5E]" />
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search parts or SKU..." className="w-full bg-[#1C1C1E] border border-[#2A2A2E] rounded-lg pl-9 pr-3 py-2 text-sm outline-none focus:border-[#E8571F]" />
      </div>
      {filtered.length === 0 ? <EmptyState icon="package" title="No parts found" subtitle="Try a different search term." /> : (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {filtered.map((p) => (
            <TiltCard key={p.id} className="bg-[#1C1C1E] border border-[#2A2A2E] rounded-xl p-4 flex flex-col">
              <div className="w-full aspect-[4/3] bg-[#2A2A2E] rounded-lg mb-3 overflow-hidden"><PartVisual image={p.image} category={p.category} alt={p.name} /></div>
              <div className="flex items-center justify-between mb-1"><Badge>{p.sku}</Badge><span className="text-xs text-[#5A5A5E]">{p.category}</span></div>
              <h3 className="font-medium text-sm leading-snug mb-1 flex-1">{p.name}</h3>
              {p.deliveryTime && <p className="text-xs text-[#8B8D92] flex items-center gap-1 mb-2"><Icon name="clock" size={12} /> Ships in {p.deliveryTime}</p>}
              <div className="flex items-center justify-between mt-1">
                <span className="font-display text-lg font-bold">{inr(p.price)}</span>
                <span className={`text-xs font-mono ${p.stock > 0 ? "text-[#7CA982]" : "text-[#C4635A]"}`}>{p.stock > 0 ? `${p.stock} in stock` : "Out of stock"}</span>
              </div>
              <button disabled={p.stock <= 0} onClick={() => onAdd(p.id)} className="mt-3 w-full bg-[#E8571F] disabled:bg-[#2A2A2E] disabled:text-[#5A5A5E] text-[#141416] font-medium text-sm py-2 rounded-lg hover:bg-[#D14A15] transition-colors flex items-center justify-center gap-1.5">
                <Icon name="plus" size={15} /> Add to Cart
              </button>
            </TiltCard>
          ))}
        </div>
      )}
    </div>
  );
}
